<ion-tabs (ionTabsDidChange)="tabChanged()">
  <ion-tab-bar slot="bottom" id="app-tab-bar" class="custom-tab-bar" mode="md" [style.--tab-index]="indicator" [class.no-selection]="active<0" [class.help-selected]="active===2">
    <span class="tab-indicator" aria-hidden="true"></span>
    @for (tab of tabs; track tab.id; let i = $index) {
      <ion-tab-button [tab]="tab.id" [class.related-selected]="i===1 && active===1" [attr.aria-label]="tab.label" [routerLink]="['/'+tab.id]">
        <ion-icon [name]="active===i ? tab.icon : tab.icon+'-outline'"></ion-icon><span>{{tab.label}}</span>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
