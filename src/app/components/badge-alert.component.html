<div class="fixed inset-0 flex items-center justify-center bg-black/60 z-50">
  <div
    class="bg-white rounded-3xl shadow-2xl text-center px-8 py-8 w-[90%] max-w-sm animate-fadeIn"
  >
    <div class="text-7xl mb-3">{{ badgeEmoji }}</div>
    <h2 class="text-2xl font-extrabold text-indigo-800 mb-2">{{ badgeName }}</h2>

    <p class="text-gray-700 mb-2 text-lg">
      Score:
      <span class="font-semibold">{{ score }}%</span>
    </p>

    <p class="text-gray-500 mb-6 text-sm">{{ badgeDescription }}</p>

    <div class="flex justify-center gap-3">
      <button
        (click)="viewProgress()"
        class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl transition-all active:scale-95"
      >
        View Progress
      </button>

      <button
        (click)="close()"
        class="border border-gray-300 text-gray-700 px-5 py-2.5 rounded-xl font-medium hover:bg-gray-100 transition-all active:scale-95"
      >
        Continue
      </button>
    </div>
  </div>
</div>
